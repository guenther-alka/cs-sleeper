name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }}.${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            arch: amd64
            platform: mswin
            ext: .exe
          - goos: linux
            arch: amd64
            platform: linux
            ext: ""
          - goos: linux
            arch: arm64
            platform: linux
            ext: ""
          - goos: illumos
            arch: amd64
            platform: illumos
            ext: ""
          - goos: solaris
            arch: amd64
            platform: solaris
            ext: ""
          - goos: freebsd
            arch: amd64
            platform: freebsd
            ext: ""
          - goos: darwin
            arch: amd64
            platform: darwin
            ext: ""
          - goos: darwin
            arch: arm64
            platform: darwin
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "dist/${{ matrix.platform }}.${{ matrix.arch }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o "dist/${{ matrix.platform }}.${{ matrix.arch }}/cs-sleeper${{ matrix.ext }}" .

      - name: Package
        run: |
          tar -czf "dist/cs-sleeper-${{ matrix.platform }}.${{ matrix.arch }}.tar.gz" \
            -C dist "${{ matrix.platform }}.${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs-sleeper-${{ matrix.platform }}.${{ matrix.arch }}
          path: dist/cs-sleeper-${{ matrix.platform }}.${{ matrix.arch }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.tar.gz
