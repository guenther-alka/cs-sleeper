name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }}.${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            arch: amd64
            platform: mswin
            ext: .exe
          - goos: linux
            arch: amd64
            platform: linux
            ext: ""
          - goos: linux
            arch: arm64
            platform: linux
            ext: ""
          - goos: illumos
            arch: amd64
            platform: illumos
            ext: ""
          - goos: solaris
            arch: amd64
            platform: solaris
            ext: ""
          - goos: freebsd
            arch: amd64
            platform: freebsd
            ext: ""
          - goos: darwin
            arch: amd64
            platform: darwin
            ext: ""
          - goos: darwin
            arch: arm64
            platform: darwin
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "dist/${{ matrix.platform }}.${{ matrix.arch }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -o "dist/${{ matrix.platform }}.${{ matrix.arch }}/cs-sleeper${{ matrix.ext }}" .

      - name: Package
        run: |
          tar -czf "dist/cs-sleeper-${{ matrix.platform }}.${{ matrix.arch }}.tar.gz" \
            -C dist "${{ matrix.platform }}.${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cs-sleeper-${{ matrix.platform }}.${{ matrix.arch }}
          path: dist/cs-sleeper-${{ matrix.platform }}.${{ matrix.arch }}.tar.gz

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
